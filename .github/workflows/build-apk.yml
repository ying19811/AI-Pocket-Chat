name: 打包 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode = 提交总数，需要完整历史

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 装 SDK Platform 37
        run: sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      # 固定签名：每次出的包签名一致，才能覆盖安装不丢数据
      - name: 写入签名钥匙
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "没配签名钥匙 secret，停止"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=pocketchat"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: 打包
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Pocket-Chat-apk
          path: app/build/outputs/apk/release/*.apk
